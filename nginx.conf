# Stage 3: no application code in the request path at all.
# Every result was rendered to a file at publish time, so serving one is a sendfile() call.
worker_processes  auto;
worker_rlimit_nofile 65535;
events { worker_connections 8192; multi_accept on; }

http {
    access_log off;                     # logging every request is itself a bottleneck at this rate
    sendfile on;                        # kernel copies the file straight to the socket
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    # Keep file descriptors and metadata cached: at 100k req/s, open() and stat() cost real time
    open_file_cache max=250000 inactive=300s;
    open_file_cache_valid 300s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    server {
        listen 8003 default_server backlog=16384;
        default_type application/json;

        # /result/123456 -> /srv/results/123/123456.json
        # The shard is the roll number without its last three digits, which is how the blobs
        # were written: 1000 files per directory keeps directory lookups fast.
        location ~ "^/result/(\d+)(\d{3})$" {
            alias /srv/results/$1/$1$2.json;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location = /health { return 200 '{"ok":true}'; }
    }
}
